{% load template_util %}
{% load static %}
<script src="{% static 'libs/sweetalert2/sweetalert2.min.js'%}"></script>
<script src="{% static 'js/pages/sweet-alerts.init.js'%}"></script>
<script type="text/javascript">
  function clearElements(elements) {
      while(elements.length > 0){
        elements[0].parentNode.removeChild(elements[0]);
      }
  }
  // checkbox 모두 선택
  $('input[name=checkbox_select_all]').on('change', function(){
    $('input[name=checkbox]').prop('checked', this.checked);
  });

  // 목록
  $(document).on("click", '#list', function(e){
    location.href = "{% url list_url %}"
  });

  // 생성
  $(document).on("click", '#create', function(e){
    var formData = new FormData();
    var $crf_token = $('[name="csrfmiddlewaretoken"]').attr('value');
    
    {% for field, property in create_fields.items %}
      formData.append("{{ field }}", document.getElementById("{{ field }}").value)
    {% endfor %}
    
    role = formData.get('role');
    
    if(role != 'normal' && role != ''){
      // 사진
      licenses = $('#license-dropzone')[0].dropzone.getAcceptedFiles()
      for(i = 0; i < licenses.length; i++){
        formData.append("licenses", licenses[i])
      }
    }
    
    if(role == "registered_instructor" || role == "responsible_instructor"){
      formData.append("instructor_expired_date", document.getElementById("instructor_expired_date").value)
    }

    $.ajax({

      headers: {"X-CSRFToken": $crf_token},
      type: "POST", 
      url: "{% url create_url %}",
      data: formData,

      success: function (response) {
        location.href = "{% url list_url %}"
      },

      error: function (xhr, status, error) {
        response_text = JSON.parse(xhr.responseText);
        alert(response_text.error)
      },

      dataType: "json",
      async: true,
      cache: false,
      contentType: false,
      processData: false,
      timeout: 60000
    });
  })

  // 삭제 with 확인 버튼
  $(document).on("click", '#remove', function(e){
    var checkbox = $("input[name=checkbox]:checked");
    if(checkbox.length < 1){
      Swal.fire({
        //title: "Sweet!",
        text: "선택 된 사용자가 없습니다.",
        //imageUrl: "assets/images/logo-dark.png",
        //imageHeight: 20,
        confirmButtonColor: "#0576b9",
        confirmButtonText: "확인",
        animation: !1
      })
      return
    }

    Swal.fire({
      title: "선택한 사용자를 삭제합니다.",
      text: "삭제 된 사용자는 되돌릴 수 없습니다.",
      icon: "warning",
      showCancelButton: !0,
      confirmButtonColor: "#34c3af",
      cancelButtonColor: "#f46a6a",
      confirmButtonText: "삭제",
      cancelButtonText: "취소",
    }).then(function(t) {
        if(!t.value) return;
        var formData = new FormData();
        var $crf_token = $('[name="csrfmiddlewaretoken"]').attr('value');
        
        // get checked elements
        var checked_list = new Array();

        checkbox.each(function(i) {
          var tr = checkbox.parent().parent().eq(i);
          var td = tr.children();
          
          var code = td.slice(-1).text();
          checked_list.push(code);
        });
        formData.append("checked_list", checked_list);

        $.ajax({
          headers: {"X-CSRFToken": $crf_token},
          type: "DELETE", 
          url: "{% url list_url %}",
          data: formData,

          success: function (response) {
            Swal.fire(
              "", "선택한 사용자가 삭제되었습니다.", "success"
              ).then(function(t){
                location.reload()
            })
          },

          error: function (xhr, status, error) {
            response_text = JSON.parse(xhr.responseText);
            alert(response_text.error)
          },

          dataType: "json",
          async: true,
          cache: false,
          contentType: false,
          processData: false,
          timeout: 60000
        });
    })
  })

  // 수정
  $(document).on("click", '#update', function(e){
    // readonly 속성 제거
    {% for field, property in detail_fields.items %}
      {% if not property.read_only %}
        element = document.getElementById("{{ field }}");
        element.readOnly = false;
        element.disabled = false;
      {% endif %}
    {% endfor %}

    // 버튼 바꾸기
    list_button = document.getElementById('list');
    update_button = document.getElementById('update');

    list_button.innerText = '취소';
    update_button.innerText = '저장';

    list_button.id = 'update-cancel';
    update_button.id = 'update-confirm';

    list_button.className = 'btn btn-light w-md waves-effect';
    update_button.className = 'btn btn-danger w-md waves-effect waves-light';

    if(user_role != 'normal'){
      license_input.style.display = 'none';
      license_dropzone_input.style.display = 'block';
    }

    if(user_role == "responsible_instructor"){
      instructor_expired_date.readOnly = true;
    }
  })

  // 수정 취소
  $(document).on("click", '#update-cancel', function(e){
    {% for field, property in detail_fields.items %}
      element = document.getElementById("{{ field }}");
      element.readOnly = true;
      element.disabled = 'disabled';
      element.value = "{{ property.value }}";
      {% comment %}
      {% if property.choices %}
        element.disabled = 'disabled';
        element.value = "{{ property.value }}";
      {% else %}
        element.readOnly = true;
        element.value = "{{ property.value }}";
      {% endif %}
      {% endcomment %}
    {% endfor %}

    // 버튼 바꾸기
    list_button = document.getElementById('update-cancel');
    update_button = document.getElementById('update-confirm');

    list_button.innerText = '목록';
    update_button.innerText = '수정';

    list_button.id = 'list';
    update_button.id = 'update';

    list_button.className = 'btn btn-primary w-md waves-effect waves-light';
    update_button.className = 'btn btn-info w-md waves-effect waves-light';

    if(user_role == "normal"){
      license_input.style.display = "none";
      license_dropzone_input.style.display = "none";
      instructor_expired_date_input.style.display = "none";
      //instructor_register_date_input.style.display = "none";
    }
      
    else if(user_role == "waiting_instructor_request"){
      license_input.style.display = "block";
      license_dropzone_input.style.display = "none";
      instructor_expired_date_input.style.display = "none";
      //instructor_register_date_input.style.display = "none";
    }

    else if(user_role == "instructor"){
      license_input.style.display = "block";
      license_dropzone_input.style.display = "none";
      instructor_expired_date_input.style.display = "block";
      //instructor_register_date_input.style.display = "none";
    }
    
    else if(user_role == "registered_instructor" || user_role == "responsible_instructor"){
      license_input.style.display = "block";
      license_dropzone_input.style.display = "none";
      instructor_expired_date_input.style.display = "block";
      instructor_register_date_input.style.display = "block";
    }
  })

  // 수정 저장
  $(document).on("click", '#update-confirm', function(e){
    var formData = new FormData();
    var $crf_token = $('[name="csrfmiddlewaretoken"]').attr('value');
    
    {% for field, property in detail_fields.items %}
      {% if field != 'licenses' %}
        formData.append("{{ field }}", document.getElementById("{{ field }}").value)
      {% endif %}
    {% endfor %}

    role = formData.get('role');

    
    if(role != 'normal' && role != ''){
      licenses = $('#license-dropzone')[0].dropzone.getAcceptedFiles()
      for(i = 0; i < licenses.length; i++){
        formData.append("licenses", licenses[i], licenses[i].name)
      }
    }
    
    if(role == "registered_instructor" || role == "responsible_instructor"){
      formData.append("instructor_expired_date", document.getElementById("instructor_expired_date").value)
    }

    $.ajax({

      headers: {"X-CSRFToken": $crf_token},
      type: "PUT",
      {% if pk %}
        url: "{% url detail_url pk %}",
      {% endif %}
      data: formData,

      success: function (response) {
        location.reload()
      },

      error: function (xhr, status, error) {
        response_text = JSON.parse(xhr.responseText);
        alert(response_text.error)
      },

      dataType: "json",
      async: true,
      cache: false,
      contentType: false,
      processData: false,
      timeout: 60000
    });
  })
  
  // 생성 페이지에서 사용자 유형이 선택 됐을 때
  $('.create_field #role').on('change', function (e) {
    //var selected_option = $("option:selected", this);
    var selected_value = this.value;
    
    // 파일 첨부 초기화
    Dropzone.forElement('#license-dropzone').removeAllFiles(true)

    if(selected_value == "normal"){
      // 추가정보 없음
      license_dropzone_input.style.display = "none";
      instructor_expired_date_input.style.display = "none";
    }
      
    else if(selected_value == "waiting_instructor_request" || selected_value == "instructor"){
      // 사진
      license_dropzone_input.style.display = "block";
      instructor_expired_date_input.style.display = "none";
    }
    
    else if(selected_value == "registered_instructor"){
      // 사진, 날짜
      license_dropzone_input.style.display = "block";

      instructor_expired_date_input.style.display = "block";
      instructor_expired_date.readOnly = false;
      instructor_expired_date.value = null;
    }
    
    else if(selected_value == "responsible_instructor"){
      // 사진, 날짜 고정
      license_dropzone_input.style.display = "block";

      instructor_expired_date_input.style.display = "block";
      instructor_expired_date.readOnly = true;
      instructor_expired_date.value = "2099-12-31";
    }
    
  });

  // 수정 페이지에서 사용자 유형이 선택 됐을 때
  $('.detail_field #role').on('change', function (e) {
    var selected_value = this.value;

    if(selected_value == "normal"){
      // 추가정보 없음
      license_dropzone_input.style.display = "none";
      instructor_expired_date_input.style.display = "none";
    }
      
    else if(selected_value == "waiting_instructor_request" || selected_value == "instructor"){
      // 사진
      license_dropzone_input.style.display = "block";
      instructor_expired_date_input.style.display = "none";
    }
    
    else if(selected_value == "registered_instructor"){
      // 사진, 날짜
      license_dropzone_input.style.display = "block";

      instructor_expired_date_input.style.display = "block";
      instructor_expired_date.readOnly = false;
      instructor_expired_date.value = "{{ detail_fields.instructor_expired_date.value }}";
    }
    
    else if(selected_value == "responsible_instructor"){
      // 사진, 날짜 고정
      license_dropzone_input.style.display = "block";

      instructor_expired_date_input.style.display = "block";
      instructor_expired_date.readOnly = true;
      instructor_expired_date.value = "2099-12-31";
    }
  });

  $( document ).ready(function() {

    if (typeof Dropzone != 'undefined') {
      dropzone = Dropzone.forElement('#license-dropzone')
    
      {% for filename, url in detail_fields.licenses.value %}
        fetch("{{ url }}")
        .then(function(response) {
          return response.blob()
        })
        .then(function(blob) {
          // here the image is a blob
          blob.name = "{{ filename }}"
          dropzone.addFile(blob);
        });
        //blob = new Blob(["{{ url }}"], {type : 'image/jpeg'});
        //
      {% endfor %}
    }
    
  });

</script>
