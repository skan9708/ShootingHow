name: CD

on:
  push:
    branches: 
      - main
      - master

jobs:
  deploy:
    name: CD Pipeline
    runs-on: ubuntu-20.04

    # strategy:
      # matrix:
        # python-version: ["3.10.8"]

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          key: ${{ secrets.EC2_KEY }}
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          port: 22
          script: |
            cd ~/theme/frontend
            echo git pull https://${{ secrets.AUTHENTICATE }}@github.com/${{ github.repository }} main
            git pull https://${{ secrets.AUTHENTICATE }}@github.com/${{ github.repository }} main
            cd ../
            sudo docker compose up --build -d
